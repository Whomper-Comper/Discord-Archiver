[package]
name = "archive_engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
scraper = "0.24"
regex = "1"
unicode-segmentation = "1"
emojis = "0.9"

[profile.release]
opt-level = 3
lto = true
strip = true
