name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: node rust/tests/wasm.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
        env:
          TEST_HTTP: '1'
